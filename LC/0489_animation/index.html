  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;robot-dfs-sim&quot;&gt;
  &lt;style&gt;
    #robot-dfs-sim {
      color-scheme: light dark;
      --sim-floor: light-dark(#f7f8fb, #1c2028);
      --sim-wall: light-dark(#ffd5d9, #541c25);
      --sim-border: light-dark(#b9c0cd, #4d5666);
      --sim-clean: light-dark(#bcebdc, #155d4e);
      --sim-discovered: light-dark(#dbeafe, #1e416d);
      --sim-current: light-dark(#7657d6, #b6a2ff);
      --sim-current-text: light-dark(#ffffff, #171223);
      --sim-backtrack: light-dark(#d97706, #fbbf24);
      --sim-danger: light-dark(#dc3f4f, #ff7b87);
      --sim-visited: light-dark(#996f00, #ffd166);
      --sim-panel: light-dark(rgba(255,255,255,.78), rgba(17,20,26,.72));
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #robot-dfs-sim * { box-sizing: border-box; }

    #robot-dfs-sim .sim-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    #robot-dfs-sim h2 {
      margin: 0;
      color: var(--foreground);
      font-size: 18px;
      line-height: 1.25;
    }

    #robot-dfs-sim .sim-order {
      color: var(--muted-foreground);
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    #robot-dfs-sim .sim-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #robot-dfs-sim button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--sim-panel);
      color: var(--foreground);
      font: 600 12px/1 ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      min-height: 32px;
      padding: 0 11px;
      cursor: pointer;
    }

    #robot-dfs-sim button:hover { border-color: var(--sim-current); }
    #robot-dfs-sim button:focus-visible { outline: 2px solid var(--sim-current); outline-offset: 2px; }
    #robot-dfs-sim button:disabled { opacity: .42; cursor: default; }
    #robot-dfs-sim .sim-play { min-width: 76px; background: var(--sim-current); color: var(--sim-current-text); border-color: transparent; }

    #robot-dfs-sim .sim-speed {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      color: var(--muted-foreground);
      font-size: 12px;
    }

    #robot-dfs-sim input[type=&quot;range&quot;] { width: 96px; accent-color: var(--sim-current); }

    #robot-dfs-sim .sim-progress {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      color: var(--muted-foreground);
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-bottom: 8px;
    }

    #robot-dfs-sim .sim-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--sim-wall);
    }

    #robot-dfs-sim .sim-track-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--sim-current);
      transition: width 180ms ease;
    }

    #robot-dfs-sim .sim-stage {
      position: relative;
      width: 100%;
      margin: 0 auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--sim-panel);
    }

    #robot-dfs-sim .sim-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      width: 100%;
      aspect-ratio: 8 / 5;
    }

    #robot-dfs-sim .sim-cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      border: 1px solid var(--sim-border);
      border-radius: 9px;
      background: var(--sim-floor);
      color: var(--muted-foreground);
      font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: background 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    #robot-dfs-sim .sim-cell.wall {
      border: 2px solid var(--sim-danger);
      background:
        repeating-linear-gradient(0deg, transparent 0 15px, color-mix(in srgb, var(--sim-danger), transparent 35%) 15px 17px),
        repeating-linear-gradient(90deg, transparent 0 24px, color-mix(in srgb, var(--sim-danger), transparent 35%) 24px 26px),
        var(--sim-wall);
      color: var(--sim-danger);
      font-weight: 800;
      opacity: 1;
    }

    #robot-dfs-sim .sim-cell.discovered { background: var(--sim-discovered); }
    #robot-dfs-sim .sim-cell.cleaned { background: var(--sim-clean); }
    #robot-dfs-sim .sim-cell.current { border: 3px solid var(--sim-current); }
    #robot-dfs-sim .sim-cell.target-blocked {
      border: 4px solid var(--sim-danger);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--sim-danger), transparent 65%);
      opacity: 1;
    }
    #robot-dfs-sim .sim-cell.target-visited { border: 3px dashed var(--sim-visited); }

    #robot-dfs-sim .sim-cell-start {
      position: absolute;
      left: 5px;
      bottom: 5px;
      font: 700 8px/1 ui-sans-serif, sans-serif;
      letter-spacing: .04em;
      color: var(--muted-foreground);
    }

    #robot-dfs-sim .sim-robot {
      position: absolute;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      left: 0;
      top: 0;
      border-radius: 50%;
      background: var(--sim-current);
      color: var(--sim-current-text);
      border: 3px solid color-mix(in srgb, var(--sim-current), white 35%);
      box-shadow: 0 5px 14px rgba(0,0,0,.2);
      font-size: 21px;
      line-height: 1;
      pointer-events: none;
      transition: transform 260ms cubic-bezier(.2,.8,.2,1), background 180ms ease;
      transform-origin: center;
    }

    #robot-dfs-sim .sim-robot.backtracking { background: var(--sim-backtrack); }

    #robot-dfs-sim .sim-event {
      min-height: 48px;
      margin-top: 10px;
      padding: 9px 11px;
      border-left: 4px solid var(--sim-current);
      border-radius: 5px;
      background: var(--sim-panel);
      color: var(--foreground);
      font-size: 13px;
      line-height: 1.35;
    }

    #robot-dfs-sim .sim-event.backtracking { border-left-color: var(--sim-backtrack); }
    #robot-dfs-sim .sim-event.blocked { border-left-color: var(--sim-danger); }

    #robot-dfs-sim .sim-stack {
      overflow-x: auto;
      margin-top: 7px;
      padding: 6px 2px;
      color: var(--muted-foreground);
      font: 600 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    #robot-dfs-sim .sim-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 5px;
      color: var(--muted-foreground);
      font-size: 11px;
    }

    #robot-dfs-sim .sim-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    #robot-dfs-sim .sim-swatch { width: 12px; height: 12px; border: 1px solid var(--sim-border); border-radius: 3px; background: var(--sim-floor); }
    #robot-dfs-sim .sim-swatch.cleaned { background: var(--sim-clean); }
    #robot-dfs-sim .sim-swatch.wall { background: var(--sim-wall); border-color: var(--sim-danger); }
    #robot-dfs-sim .sim-swatch.backtrack { background: var(--sim-backtrack); border-radius: 50%; }

    @media (max-width: 480px) {
      #robot-dfs-sim .sim-title-row { align-items: flex-start; flex-direction: column; gap: 3px; }
      #robot-dfs-sim .sim-speed { width: 100%; margin-left: 0; }
      #robot-dfs-sim .sim-speed input { flex: 1; }
      #robot-dfs-sim .sim-progress { grid-template-columns: 1fr auto; }
      #robot-dfs-sim .sim-progress .sim-track { grid-column: 1 / -1; grid-row: 2; }
      #robot-dfs-sim .sim-cell { border-radius: 6px; font-size: 8px; }
      #robot-dfs-sim .sim-board { gap: 4px; }
      #robot-dfs-sim .sim-stage { padding: 7px; }
      #robot-dfs-sim .sim-robot { width: 31px; height: 31px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #robot-dfs-sim .sim-robot,
      #robot-dfs-sim .sim-track-fill,
      #robot-dfs-sim .sim-cell { transition: none; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;sim-progress&quot;&gt;

    &lt;span data-value=&quot;cleaned&quot;&gt;0 / 30 cleaned&lt;/span&gt;

  &lt;div class=&quot;sim-stage&quot;&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;robot-dfs-sim&#x27;);
      if (!root || root.dataset.ready === &#x27;true&#x27;) return;
      root.dataset.ready = &#x27;true&#x27;;

      const board = root.querySelector(&#x27;.sim-board&#x27;);
      const robotMarker = root.querySelector(&#x27;.sim-robot&#x27;);
      const eventBox = root.querySelector(&#x27;.sim-event&#x27;);
      const stackBox = root.querySelector(&#x27;.sim-stack&#x27;);
      const playButton = root.querySelector(&#x27;[data-action=&quot;play&quot;]&#x27;);
      const previousButton = root.querySelector(&#x27;[data-action=&quot;previous&quot;]&#x27;);
      const nextButton = root.querySelector(&#x27;[data-action=&quot;next&quot;]&#x27;);
      const restartButton = root.querySelector(&#x27;[data-action=&quot;restart&quot;]&#x27;);
      const speedInput = root.querySelector(&#x27;[data-action=&quot;speed&quot;]&#x27;);
      const speedValue = root.querySelector(&#x27;[data-value=&quot;speed&quot;]&#x27;);
      const stepValue = root.querySelector(&#x27;[data-value=&quot;step&quot;]&#x27;);
      const cleanedValue = root.querySelector(&#x27;[data-value=&quot;cleaned&quot;]&#x27;);
      const trackFill = root.querySelector(&#x27;.sim-track-fill&#x27;);

      const rows = [0, 1, 2, 3, 4];
      const cols = [0, 1, 2, 3, 4, 5, 6, 7];
      const openCells = new Set([
        &#x27;0,0&#x27;, &#x27;0,1&#x27;, &#x27;0,2&#x27;, &#x27;0,3&#x27;, &#x27;0,4&#x27;,        &#x27;0,6&#x27;, &#x27;0,7&#x27;,
        &#x27;1,0&#x27;, &#x27;1,1&#x27;, &#x27;1,2&#x27;, &#x27;1,3&#x27;, &#x27;1,4&#x27;,        &#x27;1,6&#x27;, &#x27;1,7&#x27;,
        &#x27;2,0&#x27;,        &#x27;2,2&#x27;, &#x27;2,3&#x27;, &#x27;2,4&#x27;, &#x27;2,5&#x27;, &#x27;2,6&#x27;, &#x27;2,7&#x27;,
                            &#x27;3,3&#x27;,
        &#x27;4,0&#x27;, &#x27;4,1&#x27;, &#x27;4,2&#x27;, &#x27;4,3&#x27;, &#x27;4,4&#x27;, &#x27;4,5&#x27;, &#x27;4,6&#x27;, &#x27;4,7&#x27;
      ]);
      const totalOpen = openCells.size;
      // We call the unknown initial orientation &quot;north&quot; for visualization.
      // The algorithm only needs this relative clockwise ordering.
      const directionVectors = [[-1, 0], [0, 1], [1, 0], [0, -1]];
      const directionNames = [&#x27;north&#x27;, &#x27;east&#x27;, &#x27;south&#x27;, &#x27;west&#x27;];
      const cells = new Map();

      const key = (row, col) =&gt; `${row},${col}`;
      const label = (row, col) =&gt; `(${row},${col})`;

      rows.forEach((row) =&gt; {
        cols.forEach((col) =&gt; {
          const cell = document.createElement(&#x27;div&#x27;);
          const cellKey = key(row, col);
          cell.className = `sim-cell ${openCells.has(cellKey) ? &#x27;open&#x27; : &#x27;wall&#x27;}`;
          cell.dataset.key = cellKey;
          cell.textContent = openCells.has(cellKey) ? label(row, col) : &#x27;BLOCKED&#x27;;
          if (cellKey === &#x27;1,3&#x27;) {
            const start = document.createElement(&#x27;span&#x27;);
            start.className = &#x27;sim-cell-start&#x27;;
            start.textContent = &#x27;START&#x27;;
            cell.appendChild(start);
          }
          board.appendChild(cell);
          cells.set(cellKey, cell);
        });
      });

      const state = {
        row: 1,
        col: 3,
        direction: 0,

        eventBox.textContent = event.message;

        const stackText = event.stack.length
          ? event.stack.map(([row, col]) =&gt; label(row, col)).join(&#x27; → &#x27;)

        stackBox.textContent = `DFS stack: ${stackText}`;

        cleanedValue.textContent = `${cleaned.size} / ${totalOpen} cleaned`;
        trackFill.style.width = `${(index / (events.length - 1)) * 100}%`;
        previousButton.disabled = index === 0;
        nextButton.disabled = index === events.length - 1;

        if (index === events.length - 1 &amp;&amp; playing) {

          syncPlayButton();
          clearTimer();

      function clearTimer() {

        playing = false;
        clearTimer();
        index = Math.max(0, index - 1);
        syncPlayButton();
        render(true);

      nextButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        playing = false;
        clearTimer();
        index = Math.min(events.length - 1, index + 1);
        syncPlayButton();
        render(true);

        clearTimer();
        index = 0;
        playing = true;
        syncPlayButton();
        render(true);

        speedValue.textContent = `${Number(speedInput.value).toFixed(2).replace(/\.00$/, &#x27;&#x27;)}×`;
        if (playing) scheduleNext();

      render(true);

  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil

      openTooltip(trigger);
      return;

    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
