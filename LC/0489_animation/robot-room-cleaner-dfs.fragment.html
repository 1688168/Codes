<div id="robot-dfs-sim">
  <style>
    #robot-dfs-sim {
      color-scheme: light dark;
      --sim-floor: light-dark(#f7f8fb, #1c2028);
      --sim-wall: light-dark(#ffd5d9, #541c25);
      --sim-border: light-dark(#b9c0cd, #4d5666);
      --sim-clean: light-dark(#bcebdc, #155d4e);
      --sim-discovered: light-dark(#dbeafe, #1e416d);
      --sim-current: light-dark(#7657d6, #b6a2ff);
      --sim-current-text: light-dark(#ffffff, #171223);
      --sim-backtrack: light-dark(#d97706, #fbbf24);
      --sim-danger: light-dark(#dc3f4f, #ff7b87);
      --sim-visited: light-dark(#996f00, #ffd166);
      --sim-panel: light-dark(rgba(255,255,255,.78), rgba(17,20,26,.72));
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    #robot-dfs-sim * { box-sizing: border-box; }

    #robot-dfs-sim .sim-title-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    #robot-dfs-sim h2 {
      margin: 0;
      color: var(--foreground);
      font-size: 18px;
      line-height: 1.25;
    }

    #robot-dfs-sim .sim-order {
      color: var(--muted-foreground);
      font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    #robot-dfs-sim .sim-controls {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    #robot-dfs-sim button {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--sim-panel);
      color: var(--foreground);
      font: 600 12px/1 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 32px;
      padding: 0 11px;
      cursor: pointer;
    }

    #robot-dfs-sim button:hover { border-color: var(--sim-current); }
    #robot-dfs-sim button:focus-visible { outline: 2px solid var(--sim-current); outline-offset: 2px; }
    #robot-dfs-sim button:disabled { opacity: .42; cursor: default; }
    #robot-dfs-sim .sim-play { min-width: 76px; background: var(--sim-current); color: var(--sim-current-text); border-color: transparent; }

    #robot-dfs-sim .sim-speed {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-left: auto;
      color: var(--muted-foreground);
      font-size: 12px;
    }

    #robot-dfs-sim input[type="range"] { width: 96px; accent-color: var(--sim-current); }

    #robot-dfs-sim .sim-progress {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      color: var(--muted-foreground);
      font: 600 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-bottom: 8px;
    }

    #robot-dfs-sim .sim-track {
      height: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--sim-wall);
    }

    #robot-dfs-sim .sim-track-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--sim-current);
      transition: width 180ms ease;
    }

    #robot-dfs-sim .sim-stage {
      position: relative;
      width: 100%;
      margin: 0 auto;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--sim-panel);
    }

    #robot-dfs-sim .sim-board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      width: 100%;
      aspect-ratio: 8 / 5;
    }

    #robot-dfs-sim .sim-cell {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      border: 1px solid var(--sim-border);
      border-radius: 9px;
      background: var(--sim-floor);
      color: var(--muted-foreground);
      font: 600 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      transition: background 180ms ease, border-color 180ms ease, opacity 180ms ease;
    }

    #robot-dfs-sim .sim-cell.wall {
      border: 2px solid var(--sim-danger);
      background:
        repeating-linear-gradient(0deg, transparent 0 15px, color-mix(in srgb, var(--sim-danger), transparent 35%) 15px 17px),
        repeating-linear-gradient(90deg, transparent 0 24px, color-mix(in srgb, var(--sim-danger), transparent 35%) 24px 26px),
        var(--sim-wall);
      color: var(--sim-danger);
      font-weight: 800;
      opacity: 1;
    }

    #robot-dfs-sim .sim-cell.discovered { background: var(--sim-discovered); }
    #robot-dfs-sim .sim-cell.cleaned { background: var(--sim-clean); }
    #robot-dfs-sim .sim-cell.current { border: 3px solid var(--sim-current); }
    #robot-dfs-sim .sim-cell.target-blocked {
      border: 4px solid var(--sim-danger);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--sim-danger), transparent 65%);
      opacity: 1;
    }
    #robot-dfs-sim .sim-cell.target-visited { border: 3px dashed var(--sim-visited); }

    #robot-dfs-sim .sim-cell-start {
      position: absolute;
      left: 5px;
      bottom: 5px;
      font: 700 8px/1 ui-sans-serif, sans-serif;
      letter-spacing: .04em;
      color: var(--muted-foreground);
    }

    #robot-dfs-sim .sim-robot {
      position: absolute;
      z-index: 4;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      left: 0;
      top: 0;
      border-radius: 50%;
      background: var(--sim-current);
      color: var(--sim-current-text);
      border: 3px solid color-mix(in srgb, var(--sim-current), white 35%);
      box-shadow: 0 5px 14px rgba(0,0,0,.2);
      font-size: 21px;
      line-height: 1;
      pointer-events: none;
      transition: transform 260ms cubic-bezier(.2,.8,.2,1), background 180ms ease;
      transform-origin: center;
    }

    #robot-dfs-sim .sim-robot.backtracking { background: var(--sim-backtrack); }

    #robot-dfs-sim .sim-event {
      min-height: 48px;
      margin-top: 10px;
      padding: 9px 11px;
      border-left: 4px solid var(--sim-current);
      border-radius: 5px;
      background: var(--sim-panel);
      color: var(--foreground);
      font-size: 13px;
      line-height: 1.35;
    }

    #robot-dfs-sim .sim-event.backtracking { border-left-color: var(--sim-backtrack); }
    #robot-dfs-sim .sim-event.blocked { border-left-color: var(--sim-danger); }

    #robot-dfs-sim .sim-stack {
      overflow-x: auto;
      margin-top: 7px;
      padding: 6px 2px;
      color: var(--muted-foreground);
      font: 600 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: nowrap;
    }

    #robot-dfs-sim .sim-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 5px;
      color: var(--muted-foreground);
      font-size: 11px;
    }

    #robot-dfs-sim .sim-legend-item { display: inline-flex; align-items: center; gap: 5px; }
    #robot-dfs-sim .sim-swatch { width: 12px; height: 12px; border: 1px solid var(--sim-border); border-radius: 3px; background: var(--sim-floor); }
    #robot-dfs-sim .sim-swatch.cleaned { background: var(--sim-clean); }
    #robot-dfs-sim .sim-swatch.wall { background: var(--sim-wall); border-color: var(--sim-danger); }
    #robot-dfs-sim .sim-swatch.backtrack { background: var(--sim-backtrack); border-radius: 50%; }

    @media (max-width: 480px) {
      #robot-dfs-sim .sim-title-row { align-items: flex-start; flex-direction: column; gap: 3px; }
      #robot-dfs-sim .sim-speed { width: 100%; margin-left: 0; }
      #robot-dfs-sim .sim-speed input { flex: 1; }
      #robot-dfs-sim .sim-progress { grid-template-columns: 1fr auto; }
      #robot-dfs-sim .sim-progress .sim-track { grid-column: 1 / -1; grid-row: 2; }
      #robot-dfs-sim .sim-cell { border-radius: 6px; font-size: 8px; }
      #robot-dfs-sim .sim-board { gap: 4px; }
      #robot-dfs-sim .sim-stage { padding: 7px; }
      #robot-dfs-sim .sim-robot { width: 31px; height: 31px; font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      #robot-dfs-sim .sim-robot,
      #robot-dfs-sim .sim-track-fill,
      #robot-dfs-sim .sim-cell { transition: none; }
    }
  </style>

  <div class="sim-title-row">
    <h2>Example 1: Robot Room Cleaner DFS</h2>
    <span class="sim-order">room 5 × 8 · start (1,3) · facing north</span>
  </div>

  <div class="sim-controls" aria-label="Animation controls">
    <button type="button" data-action="restart" aria-label="Restart animation">↺ Restart</button>
    <button type="button" data-action="previous" aria-label="Previous step">← Step</button>
    <button type="button" class="sim-play" data-action="play" aria-label="Pause animation">Pause</button>
    <button type="button" data-action="next" aria-label="Next step">Step →</button>
    <label class="sim-speed">Speed
      <input data-action="speed" type="range" min="0.5" max="4" step="0.25" value="2" aria-label="Animation speed">
      <span data-value="speed">2×</span>
    </label>
  </div>

  <div class="sim-progress">
    <div class="sim-track" aria-hidden="true"><div class="sim-track-fill"></div></div>
    <span data-value="step">Step 1 / 1</span>
    <span data-value="cleaned">0 / 30 cleaned</span>
  </div>

  <div class="sim-stage">
    <div class="sim-board" role="img" aria-label="The five by eight Example 1 room showing walls, open cells, cleaned cells, and the robot"></div>
    <div class="sim-robot" aria-hidden="true">▲</div>
  </div>

  <div class="sim-event" aria-live="polite"></div>
  <div class="sim-stack"></div>

  <div class="sim-legend" aria-label="Legend">
    <span class="sim-legend-item"><span class="sim-swatch"></span>not discovered</span>
    <span class="sim-legend-item"><span class="sim-swatch cleaned"></span>cleaned</span>
    <span class="sim-legend-item"><span class="sim-swatch wall"></span>wall</span>
    <span class="sim-legend-item"><span class="sim-swatch backtrack"></span>orange robot = goBack</span>
  </div>

  <script>
    (() => {
      const root = document.getElementById('robot-dfs-sim');
      if (!root || root.dataset.ready === 'true') return;
      root.dataset.ready = 'true';

      const board = root.querySelector('.sim-board');
      const robotMarker = root.querySelector('.sim-robot');
      const eventBox = root.querySelector('.sim-event');
      const stackBox = root.querySelector('.sim-stack');
      const playButton = root.querySelector('[data-action="play"]');
      const previousButton = root.querySelector('[data-action="previous"]');
      const nextButton = root.querySelector('[data-action="next"]');
      const restartButton = root.querySelector('[data-action="restart"]');
      const speedInput = root.querySelector('[data-action="speed"]');
      const speedValue = root.querySelector('[data-value="speed"]');
      const stepValue = root.querySelector('[data-value="step"]');
      const cleanedValue = root.querySelector('[data-value="cleaned"]');
      const trackFill = root.querySelector('.sim-track-fill');

      const rows = [0, 1, 2, 3, 4];
      const cols = [0, 1, 2, 3, 4, 5, 6, 7];
      const openCells = new Set([
        '0,0', '0,1', '0,2', '0,3', '0,4',        '0,6', '0,7',
        '1,0', '1,1', '1,2', '1,3', '1,4',        '1,6', '1,7',
        '2,0',        '2,2', '2,3', '2,4', '2,5', '2,6', '2,7',
                            '3,3',
        '4,0', '4,1', '4,2', '4,3', '4,4', '4,5', '4,6', '4,7'
      ]);
      const totalOpen = openCells.size;
      // We call the unknown initial orientation "north" for visualization.
      // The algorithm only needs this relative clockwise ordering.
      const directionVectors = [[-1, 0], [0, 1], [1, 0], [0, -1]];
      const directionNames = ['north', 'east', 'south', 'west'];
      const cells = new Map();

      const key = (row, col) => `${row},${col}`;
      const label = (row, col) => `(${row},${col})`;

      rows.forEach((row) => {
        cols.forEach((col) => {
          const cell = document.createElement('div');
          const cellKey = key(row, col);
          cell.className = `sim-cell ${openCells.has(cellKey) ? 'open' : 'wall'}`;
          cell.dataset.key = cellKey;
          cell.textContent = openCells.has(cellKey) ? label(row, col) : 'BLOCKED';
          if (cellKey === '1,3') {
            const start = document.createElement('span');
            start.className = 'sim-cell-start';
            start.textContent = 'START';
            cell.appendChild(start);
          }
          board.appendChild(cell);
          cells.set(cellKey, cell);
        });
      });

      const state = {
        row: 1,
        col: 3,
        direction: 0,
        visited: new Set(['1,3']),
        cleaned: new Set(),
        stack: [],
        mode: 'normal'
      };
      const events = [];

      function record(type, message, target = null) {
        events.push({
          type,
          message,
          target,
          row: state.row,
          col: state.col,
          direction: state.direction,
          visited: [...state.visited],
          cleaned: [...state.cleaned],
          stack: state.stack.map((item) => [...item]),
          mode: state.mode
        });
      }

      function turnRight(message, mode = 'normal') {
        state.mode = mode;
        state.direction = (state.direction + 1) % 4;
        record(mode === 'backtrack' ? 'back-turn' : 'turn', message);
      }

      function dfs(row, col, currentDirection) {
        state.stack.push([row, col]);
        state.mode = 'normal';
        record('enter', `Enter DFS at ${label(row, col)} facing ${directionNames[currentDirection]}.`);

        state.cleaned.add(key(row, col));
        record('clean', `Clean ${label(row, col)}. This cell will never need another DFS call.`);

        for (let kk = 1; kk <= 4; kk += 1) {
          const nextDirection = (currentDirection + kk) % 4;
          turnRight(`Turn right. The robot now faces ${directionNames[nextDirection]}.`);

          const [dr, dc] = directionVectors[nextDirection];
          const nextRow = row + dr;
          const nextCol = col + dc;
          const nextKey = key(nextRow, nextCol);
          const target = [nextRow, nextCol];

          if (state.visited.has(nextKey)) {
            record('visited', `${label(nextRow, nextCol)} is already visited, so do not move into it.`, target);
          } else if (!openCells.has(nextKey)) {
            record('blocked', `move() toward ${label(nextRow, nextCol)} returns false: there is a wall.`, target);
          } else {
            state.row = nextRow;
            state.col = nextCol;
            state.visited.add(nextKey);
            record('move', `move() succeeds. Enter the unvisited child ${label(nextRow, nextCol)}.`, target);

            dfs(nextRow, nextCol, nextDirection);

            state.stack.pop();
            state.mode = 'backtrack';
            record('return', `Child DFS is finished, but the robot is still at ${label(nextRow, nextCol)}. Now execute goBack().`);

            turnRight('goBack: turn right once.', 'backtrack');
            turnRight('goBack: turn right twice, so the robot faces its parent.', 'backtrack');

            state.row = row;
            state.col = col;
            record('back-move', `goBack: move forward once to return physically to parent ${label(row, col)}.`);

            turnRight('goBack: third right turn.', 'backtrack');
            turnRight(`goBack complete: position and direction are restored at ${label(row, col)}.`, 'backtrack');
            state.mode = 'normal';
          }
        }
      }

      state.stack.push([1, 3]);
      record('start', 'Start at Example 1 position (1,3), facing north. The algorithm names this orientation direction 0.');
      state.stack.pop();
      dfs(1, 3, 0);
      state.stack.pop();
      state.mode = 'normal';
      record('done', 'DFS is complete: all 30 accessible cells are clean, and the robot is back at start position (1,3).');

      let index = 0;
      let playing = true;
      let timer = null;

      function markerTransform(event, immediate = false) {
        const cell = cells.get(key(event.row, event.col));
        if (!cell) return;
        const x = cell.offsetLeft + (cell.offsetWidth - robotMarker.offsetWidth) / 2;
        const y = cell.offsetTop + (cell.offsetHeight - robotMarker.offsetHeight) / 2;
        const degrees = [0, 90, 180, 270][event.direction];
        if (immediate) robotMarker.style.transition = 'none';
        robotMarker.style.transform = `translate(${x}px, ${y}px) rotate(${degrees}deg)`;
        if (immediate) {
          robotMarker.getBoundingClientRect();
          robotMarker.style.transition = '';
        }
      }

      function render(immediate = false) {
        const event = events[index];
        const visited = new Set(event.visited);
        const cleaned = new Set(event.cleaned);

        cells.forEach((cell, cellKey) => {
          cell.classList.remove('discovered', 'cleaned', 'current', 'target-blocked', 'target-visited');
          if (visited.has(cellKey)) cell.classList.add('discovered');
          if (cleaned.has(cellKey)) cell.classList.add('cleaned');
          if (cellKey === key(event.row, event.col)) cell.classList.add('current');
        });

        if (event.target) {
          const targetCell = cells.get(key(event.target[0], event.target[1]));
          if (targetCell && event.type === 'blocked') targetCell.classList.add('target-blocked');
          if (targetCell && event.type === 'visited') targetCell.classList.add('target-visited');
        }

        markerTransform(event, immediate);
        const isBacktracking = event.mode === 'backtrack' || event.type.startsWith('back') || event.type === 'return';
        robotMarker.classList.toggle('backtracking', isBacktracking);
        eventBox.className = `sim-event${isBacktracking ? ' backtracking' : ''}${event.type === 'blocked' ? ' blocked' : ''}`;
        eventBox.textContent = event.message;

        const stackText = event.stack.length
          ? event.stack.map(([row, col]) => label(row, col)).join(' → ')
          : 'empty';
        stackBox.textContent = `DFS stack: ${stackText}`;

        stepValue.textContent = `Step ${index + 1} / ${events.length}`;
        cleanedValue.textContent = `${cleaned.size} / ${totalOpen} cleaned`;
        trackFill.style.width = `${(index / (events.length - 1)) * 100}%`;
        previousButton.disabled = index === 0;
        nextButton.disabled = index === events.length - 1;

        if (index === events.length - 1 && playing) {
          playing = false;
          syncPlayButton();
          clearTimer();
        }
      }

      function clearTimer() {
        if (timer !== null) {
          window.clearTimeout(timer);
          timer = null;
        }
      }

      function delayFor(event) {
        const speed = Number(speedInput.value);
        const base = event.type === 'clean' || event.type === 'move' || event.type === 'back-move' ? 780 : 520;
        return base / speed;
      }

      function scheduleNext() {
        clearTimer();
        if (!playing || index >= events.length - 1) return;
        timer = window.setTimeout(() => {
          index += 1;
          render();
          scheduleNext();
        }, delayFor(events[index]));
      }

      function syncPlayButton() {
        playButton.textContent = playing ? 'Pause' : 'Play';
        playButton.setAttribute('aria-label', playing ? 'Pause animation' : 'Play animation');
      }

      playButton.addEventListener('click', () => {
        if (index === events.length - 1) index = 0;
        playing = !playing;
        syncPlayButton();
        render(index === 0);
        if (playing) scheduleNext();
        else clearTimer();
      });

      previousButton.addEventListener('click', () => {
        playing = false;
        clearTimer();
        index = Math.max(0, index - 1);
        syncPlayButton();
        render(true);
      });

      nextButton.addEventListener('click', () => {
        playing = false;
        clearTimer();
        index = Math.min(events.length - 1, index + 1);
        syncPlayButton();
        render(true);
      });

      restartButton.addEventListener('click', () => {
        clearTimer();
        index = 0;
        playing = true;
        syncPlayButton();
        render(true);
        scheduleNext();
      });

      speedInput.addEventListener('input', () => {
        speedValue.textContent = `${Number(speedInput.value).toFixed(2).replace(/\.00$/, '')}×`;
        if (playing) scheduleNext();
      });

      const resizeObserver = new ResizeObserver(() => markerTransform(events[index], true));
      resizeObserver.observe(board);

      syncPlayButton();
      render(true);
      window.setTimeout(scheduleNext, 450);
    })();
  </script>
</div>
